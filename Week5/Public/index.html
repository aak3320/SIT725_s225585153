<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Aakash">
    <meta name="description" content="This webpage gives information Books.">
    <title>Task 5.2P | MVC</title>
    <!-- Compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <!-- Compiled and minified JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!--Navbar-->
    <nav>
        <div class="nav-wrapper navbar-size">
            <a href="#!" class="brand-logo left">
                <span class="nav-title">📚 BookShelf</span>
            </a>
            <ul id="nav-mobile" class="right hide-on-med-and-down">
                <li><u><a target="_blank" href="https://github.com/aak3320/SIT725_s225585153.git">GitHub</a></li></u>
                </li>
            </ul>
        </div>
    </nav>

    <!--Main Body - Main image, Book Card,, Join club form -->
    <main class="main-body">
        <div class="container">

            <!--Banner Image section-->
            <div class="row">
                <div class="col s12 center-align">
                    <h1 id="heading">Welcome to Bookshelf</h1>
                    <p class="flow-text">
                        This application is built to explore computer related books in easy and organized way. It allows
                        users to view
                        book titles, author, and description.
                    </p>
                </div>
                <div class="col s12 center-align">
                    <img class="materialboxed materialboxed-image center" src="images/Banner_image.png"
                        alt="Bookshelf banner" />
                </div>
                <div class="col s12 center-align">
                    <a class="waves-effect waves-light btn click-me-button modal-trigger" id="fetchBooksButton"
                        data-target="modal1">
                        <i class="material-icons left">library_add</i>Show Books
                    </a>
                </div>
            </div>
        </div>

        <!--Card Section-->
        <div class="row" id="card-section">
            <div class="col s12">
                <p class="flow-text section-label">FEATURED BOOKS</p>
            </div>

            <!--Output from end point-->
            <div class="col s12" id="displayBooks">

            </div>
        
        </div>
    </main>

    <!--Jquery-->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"
        integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <!-- Compiled and minified JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

</body>
<script>

    const btn = document.getElementById('fetchBooksButton');
    const output = document.getElementById('displayBooks');

    //rendering book data and showing information of books
    function render(books) {
            output.innerHTML = '';
 
            if (!Array.isArray(books) || books.length === 0) {
                output.textContent = 'No books found.';
                return;
            }
 
            for (const book of books) {
                const p = document.createElement('p');
                p.textContent = `${book.title} - ${book.author}`;
                output.appendChild(p);
            }
    }

    //click event - whenever someone click Books Show button - it will fetch data from api/books
    btn.addEventListener('click', async () => {
            output.textContent = 'Loading...';
            try {
                const res = await fetch('/api/books');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const body = await res.json();   
                render(body.data);
                //console.log(body.data);
            } catch (err) {
                console.error('Error fetching books:', err);
                output.textContent = 'Error fetching books.';
            }
        });

</script>

</html>
